name: Linux packages
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel (stable requires clean version-tagged source)
        type: choice
        options: [nightly, stable]
        default: nightly
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DISPLAY: ''
      WAYLAND_DISPLAY: ''
      NUVIO_RUN_LIVE_DISPLAY_TESTS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Builder prerequisites (runner only)
        shell: bash
        run: |
          set -euo pipefail
          # Only host orchestration tools. App/native compilation uses the
          # digest/snapshot/hash-pinned disposable builder in the repository.
          sudo apt-get update
          sudo apt-get install -y podman jq flatpak ostree desktop-file-utils libwebkit2gtk-4.1-0 libva2 libva-drm2 libva-x11-2 libxss1 libasound2 libpulse0 liblcms2-2
          dpkg-query -W > "$RUNNER_TEMP/runner-packages.tsv"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: inputs_cache
        with:
          path: |
            build/linux-media-runtime/downloads
            build/linux-packaging/inputs
            build/linux-packaging/gradle/caches/modules-2
            build/linux-packaging/gradle/wrapper
            build/linux-webkit/downloads
            build/linux-webkit/ccache
          key: linux-inputs-${{ hashFiles('tools/linux/media-runtime/**', 'tools/linux/packaging/config.json', 'tools/linux/packaging/webkit/manifest.json', 'tools/linux/packaging/webkit/Containerfile', 'tools/linux/packaging/webkit/patches/**', 'tools/linux/packaging/webkit/build*.sh', 'gradle/**', '**/*.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-inputs-${{ hashFiles('tools/linux/media-runtime/**', 'tools/linux/packaging/config.json', 'tools/linux/packaging/webkit/manifest.json', 'tools/linux/packaging/webkit/Containerfile', 'tools/linux/packaging/webkit/patches/**', 'tools/linux/packaging/webkit/build*.sh', 'gradle/**', '**/*.gradle.kts') }}-
      - name: Diagnose Podman resource controllers
        shell: bash
        run: |
          set -euo pipefail
          podman --version
          cat /sys/fs/cgroup/cgroup.controllers || true
          image=docker.io/library/busybox:1.36
          podman pull "$image"
          base=(--rm --network=none --userns=keep-id --cap-drop=all
                --security-opt label=disable --security-opt no-new-privileges)
          probe() {
            local label="$1"
            shift
            if podman run "${base[@]}" "$@" "$image" /bin/true; then
              echo "PODMAN_${label}=SUPPORTED"
            else
              echo "PODMAN_${label}=UNAVAILABLE"
            fi
          }
          probe BASELINE
          probe CPU --cpus=4
          probe MEMORY --memory=18g --memory-swap=18g
          probe PIDS --pids-limit=512
          echo "=== TEMPORARY CPU DELEGATION ==="
          unit="user@$(id -u).service"
          sudo systemctl set-property --runtime "$unit" "Delegate=cpu cpuset memory pids"
          systemctl show "$unit" -p Delegate -p DelegateControllers
          podman run "${base[@]}" --cpus=4 --memory=18g --memory-swap=18g --pids-limit=512 "$image" /bin/sh -ec '
            for key in cpu.max memory.max memory.swap.max pids.max; do
              printf "%s=" "$key"
              cat "/sys/fs/cgroup/$key"
            done
          '
          echo "PODMAN_COMBINED_START=SUPPORTED"
          echo "Diagnostic stop: expensive builds deliberately skipped"
          exit 1
      - name: Build private media from pinned source
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          tools/linux/media-runtime/build.sh --jobs 2
      - name: Build canonical Compose image and DEB
        id: native
        continue-on-error: true # Preserve independent Flatpak evidence on a format failure.
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          channel='${{ inputs.channel || 'nightly' }}'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(sed -n 's/^VERSION_NAME=//p' composeApp/Configuration/DesktopVersion.properties)
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag/version mismatch'; exit 1; }
            channel=stable
          fi
          python3 tools/linux/packaging/build.py --format deb --channel "$channel" --jobs 2
      - name: Independently verify DEB in its pinned builder
        id: deb
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          builder=$(jq -er '.builder_image_id' build/linux-packaging/canonical/release-info.json)
          podman run --rm --network=none --userns=keep-id --cap-drop=all \
            --security-opt label=disable --security-opt no-new-privileges \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$PWD/build/linux-packaging,dst=/output" \
            --mount "type=bind,src=$PWD/tools/linux/packaging,dst=/packaging,ro" \
            "$builder" python3 /packaging/verify.py artifacts /output --formats deb
      - name: Smoke-install DEB on Ubuntu 22.04
        id: deb_smoke
        if: ${{ !cancelled() && steps.deb.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          debs=(build/linux-packaging/artifacts/*.deb)
          [[ ${#debs[@]} -eq 1 && -s "${debs[0]}" ]]
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$PWD/${debs[0]}"
          [[ "$(dpkg-query -W -f='${Status}' nuvio-desktop)" == "install ok installed" ]]
          sudo dpkg --audit
          sudo dpkg -V nuvio-desktop
          test -x /usr/bin/nuvio-desktop
          test -s /opt/nuvio-desktop/lib/runtime/lib/server/libjvm.so
          test -s /opt/nuvio-desktop/lib/native/libplayer_bridge.so
          test -s /opt/nuvio-desktop/lib/native/libmpv.so.2
          echo "DEB Ubuntu 22.04 smoke test PASSED"
      - name: Prepare isolated pinned Flatpak runtime
        id: flatpak_runtime
        continue-on-error: true
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          export FLATPAK_USER_DIR="$RUNNER_TEMP/nuvio-flatpak"
          echo "FLATPAK_USER_DIR=$FLATPAK_USER_DIR" >> "$GITHUB_ENV"
          branch=$(jq -r .flatpak_branch tools/linux/packaging/config.json)
          commit=$(jq -r .flatpak_runtime_commit tools/linux/packaging/config.json)
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --no-related flathub "org.gnome.Platform/x86_64/$branch"
          flatpak update --user --noninteractive --no-related --commit="$commit" "org.gnome.Platform/x86_64/$branch"
          [[ $(flatpak info --user --show-commit "org.gnome.Platform//$branch") == "$commit" ]]
      - name: Export and verify Flatpak
        id: flatpak
        if: ${{ !cancelled() && steps.flatpak_runtime.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          python3 tools/linux/packaging/build.py --format flatpak
      - name: Build and verify AppImage with private production WebKit
        id: appimage
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 240
        shell: bash
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          # Reuse canonical app/media. Engine source/patch preparation, bounded
          # compilation and artifact inspection use the pinned container.
          # Download/ccache hits never bypass provenance or artifact checks.
          if ! python3 tools/linux/packaging/build.py --format appimage; then
            echo '=== WEBKIT BUILD ERROR LOG ==='
            find build/linux-webkit/generations -type f -name build.log -print -exec tail -n 100 {} \; || true
            exit 1
          fi
      - name: Save verified downloads and compiler cache even after a format failure
        if: ${{ always() && steps.inputs_cache.outputs.cache-primary-key != '' }}
        continue-on-error: true # Cache availability cannot replace artifact verification.
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.inputs_cache.outputs.cache-primary-key }}
          path: |
            build/linux-media-runtime/downloads
            build/linux-packaging/inputs
            build/linux-packaging/gradle/caches/modules-2
            build/linux-packaging/gradle/wrapper
            build/linux-webkit/downloads
            build/linux-webkit/ccache
      - name: Checksum available packages and evidence
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/runner-packages.tsv" build/linux-packaging/artifacts/
          cd build/linux-packaging/artifacts
          rm -f SHA256SUMS
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Require all three valid packages
        if: always()
        shell: bash
        run: |
          unset DISPLAY WAYLAND_DISPLAY NUVIO_RUN_LIVE_DISPLAY_TESTS
          python3 tools/linux/packaging/verify.py artifacts build/linux-packaging --formats all
          [[ '${{ steps.native.outcome }}' == success ]]
          [[ '${{ steps.appimage.outcome }}' == success ]]
          [[ '${{ steps.deb.outcome }}' == success ]]
          [[ '${{ steps.deb_smoke.outcome }}' == success ]]
          [[ '${{ steps.flatpak.outcome }}' == success ]]
          [[ '${{ steps.evidence.outcome }}' == success ]]
      - name: Report independent format results
        if: always()
        env:
          NATIVE_RESULT: ${{ steps.native.outcome }}
          APPIMAGE_RESULT: ${{ steps.appimage.outcome }}
          DEB_RESULT: ${{ steps.deb.outcome }}
          DEB_SMOKE_RESULT: ${{ steps.deb_smoke.outcome }}
          FLATPAK_RESULT: ${{ steps.flatpak.outcome }}
          FLATPAK_RUNTIME_RESULT: ${{ steps.flatpak_runtime.outcome }}
          EVIDENCE_RESULT: ${{ steps.evidence.outcome }}
        shell: bash
        run: |
          {
            echo '| Check | Outcome |'
            echo '| --- | --- |'
            echo "| DEB static verification | $DEB_RESULT |"
            echo "| DEB Ubuntu install | $DEB_SMOKE_RESULT |"
            echo "| Canonical image and DEB build | $NATIVE_RESULT |"
            echo "| Private WebKit and AppImage | $APPIMAGE_RESULT |"
            echo "| Flatpak runtime preparation | $FLATPAK_RUNTIME_RESULT |"
            echo "| Flatpak export and static verification | $FLATPAK_RESULT |"
            echo "| Available artifact checksums | $EVIDENCE_RESULT |"
            echo
            echo 'Q02 remains partial. All three verified formats are mandatory; independent successes and a compiled engine do not establish release or manual acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nuvio-linux-x86_64-${{ github.sha }}
          path: build/linux-packaging/artifacts/*
          if-no-files-found: error
          compression-level: 0
